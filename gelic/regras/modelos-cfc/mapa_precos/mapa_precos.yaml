- id: fonte_2_valor_unitario
  texto: "Referência 2 — valor unitário considerado na pesquisa (R$)"
  tipo: texto
  obrigatoria: true
  nota: "Formato 180,00 (sem R$)."
  le_do_cadastro: null

- id: fonte_3_instituicao
  texto: "Referência 3 — órgão/empresa contratada"
  tipo: texto
  obrigatoria: true
  le_do_cadastro: null

